<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky to Soil Climate PAL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a sky-to-soil band header over one calm reading column (860px learner, 1180px teacher). */
:root{
  --bg:#EAF1F5; --surface:#FFFFFF; --surface-2:#F3F8FA; --ink:#102335; --muted:#4B6073; --line:#CFDCE5;
  --accent:#0A6C8C; --accent-ink:#FFFFFF; --accent-soft:#D6ECF4;
  --earth:#8E531C; --earth-soft:#F5E7D6; --good:#2B7448; --good-soft:#DDF0E3; --warn:#9A620E; --warn-soft:#FAEED6;
  --heat:#C0412C; --rain:#2C79B0; --sun:#E0A100;
  --band1:#E4F2F9; --band2:#D0E6F3; --band3:#BAD8EC; --band4:#A3C7E3; --band5:#8DB5DA;
  --head-bg:#0D2840; --head-ink:#EAF3F9; --head-line:#2E4E6B;
  --st1:#9ED8F3; --st2:#5DB4DE; --st3:#2F86B8; --st4:#E7B04B; --st5:#8E531C;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --scale:1; --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1521; --surface:#112131; --surface-2:#0E1B29; --ink:#E3EDF5; --muted:#9AB0C3; --line:#23394D;
  --accent:#55B6D8; --accent-ink:#04131C; --accent-soft:#123447;
  --earth:#DE9F62; --earth-soft:#2C2015; --good:#6CC495; --good-soft:#123024; --warn:#E3B15C; --warn-soft:#30260F;
  --heat:#F07B63; --rain:#62AFE6; --sun:#F2C14E;
  --band1:#13293C; --band2:#173249; --band3:#1C3C58; --band4:#214668; --band5:#275079;
  --head-bg:#06101A; --head-ink:#E3EDF5; --head-line:#1F3448; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1521; --surface:#112131; --surface-2:#0E1B29; --ink:#E3EDF5; --muted:#9AB0C3; --line:#23394D;
  --accent:#55B6D8; --accent-ink:#04131C; --accent-soft:#123447;
  --earth:#DE9F62; --earth-soft:#2C2015; --good:#6CC495; --good-soft:#123024; --warn:#E3B15C; --warn-soft:#30260F;
  --heat:#F07B63; --rain:#62AFE6; --sun:#F2C14E;
  --band1:#13293C; --band2:#173249; --band3:#1C3C58; --band4:#214668; --band5:#275079;
  --head-bg:#06101A; --head-ink:#E3EDF5; --head-line:#1F3448; color-scheme:dark; }

html{font-size:calc(16px * var(--scale))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.teacher .wrap{max-width:1180px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:2rem;font-weight:700} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.2rem;font-weight:600}
p{margin:0} ul,ol{margin:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.small{font-size:.88rem;color:var(--muted)}
.lead{font-size:1.12rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[data-focus]:focus{outline:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.3rem;line-height:1;display:block}
.brand small{display:block;opacity:.78;font-size:.76rem;margin-top:2px}
.hbtn{font:inherit;font-size:.88rem;font-weight:700;color:var(--head-ink);background:transparent;border:1px solid var(--head-line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.hbtn:hover{border-color:var(--head-ink)}
.hbtn[aria-pressed="true"]{background:var(--head-ink);color:var(--head-bg)}
.hctl{display:flex;gap:6px}
.strata{display:flex;height:6px}.strata i{flex:1}
.strata i:nth-child(1){background:var(--st1)}.strata i:nth-child(2){background:var(--st2)}.strata i:nth-child(3){background:var(--st3)}.strata i:nth-child(4){background:var(--st4)}.strata i:nth-child(5){background:var(--st5)}
main{padding-block:18px 64px;display:grid;gap:16px}

/* journey rail */
.rail ol{list-style:none;padding:0;display:flex;gap:4px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.rail li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px}
.rail .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.rail li.done .dot{background:var(--good);border-color:var(--good)}
.rail li.now{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.rail li.now .dot{background:var(--accent);border-color:var(--accent)}

/* cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3.2vw,26px);min-width:0}
.stack{display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{text-align:center;justify-items:center}
.hero{padding:0;overflow:hidden}
.hero .stack{padding:clamp(16px,3.2vw,28px)}
.hero-art{display:block;width:100%;height:150px}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.list{padding-left:1.2em;display:grid;gap:6px}
.foot{font-size:.8rem;color:var(--muted);padding-top:8px}

/* form */
label{font-weight:700;font-size:.95rem;display:block}
input:not([type=range]),textarea,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
textarea{resize:vertical}
select{width:auto;padding:6px 8px;font-size:.88rem}
.field{display:grid;gap:6px;max-width:420px}
.err{color:var(--heat);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}

/* buttons */
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;min-height:44px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--heat);border-color:var(--heat);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.linkbtn{font:inherit;font-size:.9rem;font-weight:700;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.chip{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tag{font-size:.78rem;font-weight:700;color:var(--earth);background:var(--earth-soft);border-radius:999px;padding:4px 10px}

/* items */
.item{display:grid;gap:14px;min-width:0}
.stem{font-size:1.1rem;font-weight:700;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .let,.opt .box{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-family:var(--f-mono);font-size:.85rem}
.opt[aria-pressed="true"] .let,.opt[aria-pressed="true"] .box{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .let,.opt.right .box{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft);border-style:dashed}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong):not(.missed){opacity:.6}
.opt.slim{padding:8px 12px;min-height:40px}
.opt .pts{margin-left:auto;font-family:var(--f-mono);color:var(--muted)}
.tagm{font-style:normal;color:var(--good);font-size:.85rem}
.conf{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.conf-q{font-weight:700}
.actions{padding-top:2px}
.fb{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface-2);display:grid;gap:10px}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.try{background:var(--warn-soft);border-color:var(--warn)}
.fb.learn{background:var(--accent-soft);border-color:var(--accent)}
.myth{border-left:4px solid var(--earth);padding:8px 12px;background:var(--surface);border-radius:0 10px 10px 0;display:grid;gap:6px}
.hints{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:12px 14px;border:1px dashed var(--line)}
.case{background:var(--earth-soft);border-radius:12px;padding:12px 16px;display:grid;gap:6px}
.claim{font-family:var(--f-display);font-size:1.35rem;margin:0;padding:8px 0 8px 16px;border-left:4px solid var(--earth)}

/* drag & drop */
.dnd{display:grid;gap:10px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;align-items:center}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.buckets.ordered{grid-template-columns:1fr}
.buckets.ordered .bucket{display:flex;gap:10px;align-items:center;min-height:52px}
.buckets.ordered .bhead{flex:none;width:110px}
.bucket{border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--surface-2);display:grid;gap:8px;align-content:start;min-height:92px;min-width:0}
.bucket.target{border-style:dashed;border-color:var(--accent)}
.bhead{font:inherit;font-weight:700;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);cursor:pointer;text-align:left}
.bucket.target .bhead{border-color:var(--accent);color:var(--accent)}
.bin{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font:inherit;font-size:.92rem;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:grab;text-align:left;max-width:100%}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dchip.bad{border-style:dashed;border-color:var(--warn)}
.dchip.ok{border-color:var(--good);background:var(--good-soft)}
.dchip em{font-style:normal;font-size:.82rem;color:var(--good)}

/* meters, pills, badges */
.meter-row{display:flex;gap:10px;align-items:center}
.meter{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--st2),var(--good));border-radius:99px}
.meter.thin{height:6px}
.meter-l{font-size:.85rem;font-weight:700;white-space:nowrap}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.mastered{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pill.active,.pill.route{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.badge{display:inline-flex;gap:8px;align-items:center;font-weight:700;color:var(--earth);background:var(--earth-soft);border-radius:999px;padding:6px 14px}
.badge.big{font-size:1.05rem;padding:10px 18px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.mcard{display:grid;gap:10px;align-content:start}
.mcard.rec{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.path{font-size:.95rem}
.trail{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem}
.trail li{padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.trail li.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.trail li.now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.mhead{display:grid;gap:12px}
.why{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px}

/* lessons */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:.95rem;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;min-height:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:grid;gap:14px;min-width:0}
.steps{padding-left:1.4em;display:grid;gap:8px}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.story{font-size:1.06rem;line-height:1.75;max-width:65ch}
.we{background:var(--good-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.we ol{padding-left:1.3em;display:grid;gap:4px}
.farm{background:var(--earth-soft);border:1px solid var(--earth);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.farm .eyebrow{color:var(--earth)}
.words summary{font-weight:700;cursor:pointer;padding:6px 0}
.words dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:8px 0 0}
.words dt{font-weight:700}.words dd{margin:0}
.routine{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.vid{display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.vid > div{display:grid;gap:4px;min-width:0}
.vid-ph{flex:none;width:72px;height:52px;border-radius:10px;background:var(--head-bg);color:var(--head-ink);display:grid;place-items:center;font-size:1.2rem}
.task{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.rubric{display:grid;gap:6px}
.fp{border:0;padding:0;margin:0;display:grid;gap:6px}
.fp legend{font-weight:700;padding:0 0 4px}
.fpres{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.altgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center}
.altinfo{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:14px}
.altinfo .big{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){ .altgrid{grid-template-columns:1fr} .buckets.ordered .bhead{width:80px} h1{font-size:1.7rem} }
.anslist{padding-left:1.3em;display:grid;gap:12px}

/* figures */
.figbox{margin:0;display:grid;gap:6px;min-width:0}
.figbox figcaption{font-size:.86rem;color:var(--muted)}
.fig{width:100%;height:auto;display:block;max-width:560px}
.fig.tall{max-width:400px}.fig.small{max-width:240px}
.stim{background:var(--surface-2);border-radius:12px;padding:10px}
.t{fill:var(--ink);font:13px var(--f-body)}
.t-b{fill:var(--ink);font:700 13px var(--f-body)}
.t-sm{fill:var(--muted);font:12px var(--f-body)}
.t-sm2{fill:var(--ink);font:12px var(--f-body);opacity:.85}
.t-xs{fill:var(--ink);font:11px var(--f-body);opacity:.85}
.t-xs-e{fill:var(--earth);font:700 11px var(--f-body)}
.t-oe{fill:var(--earth-soft);font:700 11px var(--f-body)}
.tag-n .t-xs{fill:var(--rain);font-weight:700;opacity:1}
.t-w{fill:var(--ink);font:700 12px var(--f-body)}
.t-big{fill:var(--ink);font:700 20px var(--f-display)}
.t-bar{fill:var(--ink);font:700 11px var(--f-body)}

/* tables */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data caption{caption-side:bottom;text-align:left;font-size:.82rem;color:var(--muted);padding-top:6px}
table.bank td{min-width:110px}
table.bank td:nth-child(7),table.bank td:nth-child(8){min-width:260px}
table.bank p{margin-bottom:6px;color:var(--ink)}
tr.sub td{border-bottom-style:dashed;padding-top:0}
code{font-family:var(--f-mono);font-size:.78rem;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.ok{color:var(--good);font-weight:700}.no{color:var(--warn);font-weight:700}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}.kv dt{font-weight:700}.kv dd{margin:0}
table.hess td{text-align:center;min-width:120px}
table.hess td.on{background:var(--accent-soft)}
table.hess .n{display:block;font-family:var(--f-mono);font-size:1.2rem;color:var(--accent)}
table.hess .ids{display:block;font-size:.72rem;color:var(--muted)}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.imggrid .figbox{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.bench{list-style:none;padding:0;display:grid;gap:8px}
.bench li{display:flex;gap:12px;align-items:flex-start}
.bench .st{flex:none;width:64px;text-align:center;font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 0}
.bench li.met .st{background:var(--good-soft);color:var(--good)}
.bench li.review .st{background:var(--warn-soft);color:var(--warn)}
.bench li.pending .st{background:var(--earth-soft);color:var(--earth)}
.tabs.t{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><path d="M3 22a14 14 0 0 1 28 0" fill="none" stroke="var(--st1)" stroke-width="3"/><path d="M8 22a9 9 0 0 1 18 0" fill="none" stroke="var(--st3)" stroke-width="3"/><circle cx="17" cy="21" r="3" fill="var(--st4)"/><rect x="2" y="25" width="30" height="5" rx="2" fill="var(--st5)"/></svg>
      <div><b>Sky to Soil</b><small>Grade 9 · Atmosphere and Climate · PAL</small></div>
    </div>
    <div class="hctl" role="group" aria-label="Text size"><button class="hbtn" data-act="size" data-d="-1" aria-label="Smaller text">A−</button><button class="hbtn" data-act="size" data-d="1" aria-label="Bigger text">A+</button></div>
  </div>

{id:"WEA-P3",use:"prac",cl:"WEA",c:"WEA_01",lo:"LO3",comp:"Sorts statements into weather and climate.",bl:"Understand",dok:2,diff:"Easy",lv:1,type:"dnd",

{id:"WEA-P4",use:"prac",cl:"WEA",c:"WEA_04",lo:"LO3",comp:"Explains how heating changes air pressure and the weather.",bl:"Understand",dok:2,diff:"Moderate",lv:2,type:"mcq",

{id:"WEA-P5",use:"prac",cl:"WEA",c:"WEA_03",lo:"LO3",comp:"Identifies what happens on a humid day.",bl:"Understand",dok:2,diff:"Moderate",lv:2,type:"multi",
 stem:"On a very humid day, which of these are likely to happen? Select ALL that apply.",

{id:"WEA-P6",use:"prac",cl:"WEA",c:"WEA_05",lo:"LO4",comp:"Predicts the direction and strength of a night-time breeze.",bl:"Apply",dok:2,diff:"Moderate",lv:2,type:"mcq",

{id:"WEA-P7",use:"prac",cl:"WEA",c:"WEA_05",lo:"LO4",comp:"Puts the steps of a sea breeze in order.",bl:"Understand",dok:2,diff:"Moderate",lv:2,type:"dnd",order:true,

{id:"WEA-P8",use:"prac",cl:"WEA",c:"WEA_02",lo:"LO3",comp:"Reads temperature data to find the most even climate and explains why.",bl:"Analyze",dok:3,diff:"Difficult",lv:3,type:"mcq",

{id:"WEA-P9",use:"prac",cl:"WEA",c:"WEA_01",lo:"LO3",comp:"Judges a claim that confuses one day’s weather with climate.",bl:"Evaluate",dok:3,diff:"Difficult",lv:3,type:"mcq",

 hint:["How long a time does climate describe?","Delhi’s average March rain is only about 1.3 cm."],

{id:"WEA-C1",use:"chk",cl:"WEA",c:"WEA_04",lo:"LO3",comp:"Uses a pressure map to predict wind direction.",bl:"Apply",dok:2,diff:"Moderate",lv:2,type:"mcq",

{id:"WEA-C2",use:"chk",cl:"WEA",c:"WEA_05",lo:"LO4",comp:"Compares coastal and inland places using land and sea heating.",bl:"Analyze",dok:3,diff:"Difficult",lv:3,type:"mcq",

  steps:["Weather is what the air is like hour by hour and day by day.","Climate is the usual weather of a large area over a long time, usually 30 years or more.","Five elements shape weather and climate: temperature, humidity, precipitation, air pressure and wind.","Temperature depends on insolation, the sunlight the Earth receives. The Sun’s rays fall most directly near the equator, so it is hottest there.","Humidity is water vapour in the air. Warm air can hold more of it. On humid days, sweat and clothes dry slowly.","Precipitation is water falling from the sky: drizzle, rain, snow, sleet or hail. Most groundwater comes from rain.","Warm air rises and makes low pressure, with cloudy, wet weather. Cool air sinks and makes high pressure, with clear skies.","Wind is air moving from high pressure to low pressure. A wind is named after the direction it comes from.","In the day, land heats faster than the sea, so a sea breeze blows from sea to land. At night, land cools faster, so a gentle land breeze blows from land to sea."],

 if(k==='ATM'){ var pos=S.alt==null?10:S.alt, km=posToKm(pos), L=layerAt(km);
  return '<p class="eyebrow">Try it · Climb the sky</p><p>Move the slider to go up. Watch what changes.</p><label for="alt">Height</label><input type="range" id="alt" min="0" max="100" value="'+pos+'" data-range="alt" aria-valuetext="'+Math.round(km)+' kilometres"><div class="altgrid"><div id="altFig">'+SVGS.layers({km:km})+'</div><div id="altInfo" class="altinfo" aria-live="polite">'+altInfo(km,L)+'</div></div>'; }
 if(k==='WEA'){ var night=S.breeze==='night';
  return '<p class="eyebrow">Try it · Day and night by the sea</p><p>First predict: which way will the breeze blow? Then switch between day and night.</p><div class="row seg" role="group" aria-label="Time of day"><button class="chip" data-act="breeze" data-v="day" aria-pressed="'+!night+'">Day (2 p.m.)</button><button class="chip" data-act="breeze" data-v="night" aria-pressed="'+night+'">Night (10 p.m.)</button></div>'+figHTML({svg:'breeze',mode:night?'night':'day'})+'<p>'+(night?'At night, the land cools faster than the sea. The air over the sea is warmer and rises (low pressure). Cooler air from the land moves out to sea. The difference is small, so this land breeze is gentle.':'In the day, the land heats faster than the sea. Warm air over the land rises (low pressure). Cooler air from the sea moves in. This is a sea breeze. It keeps coastal afternoons milder.')+'</p>'; }
 if(k==='MON'){ var w=S.mseason==='winter';
  return '<p class="eyebrow">Try it · Turn the seasons</p><p>Switch between summer and winter. Watch the pressure and the winds turn around.</p><div class="row seg" role="group" aria-label="Season"><button class="chip" data-act="mseason" data-v="summer" aria-pressed="'+!w+'">Summer (June–September)</button><button class="chip" data-act="mseason" data-v="winter" aria-pressed="'+w+'">Winter (October–February)</button></div>'+figHTML({svg:'monsoon',mode:w?'winter':'summer'})
   +'<ul class="list">'+(w?'<li>The land cools faster than the sea, so <strong>high pressure</strong> forms over land.</li><li>Cold, dry winds blow from <strong>land to sea</strong>, from the north-east.</li><li>Over the Bay of Bengal they pick up moisture and bring rain to the Tamil Nadu coast.</li><li><strong>On the farm:</strong> most of India is dry, but farmers in the south-east get winter rain.</li>':'<li>The land heats faster than the ocean, so <strong>low pressure</strong> forms over land.</li><li>Moist winds blow from <strong>sea to land</strong>, from the south-west.</li><li>They bring most of India’s rain.</li><li><strong>On the farm:</strong> farmers sow and grow their crops with these rains.</li>')+'</ul>'; }
 if(k==='CLC'){ var tot=0, n=0, top=null;
  var h='<p class="eyebrow">Try it · My carbon footprint (from your textbook)</p><p>Choose the option that best describes you in each group.</p>';
  FOOTPRINT.forEach(function(g){ var v=S.fp[g.k]; if(v!=null){ tot+=g.opts[v][1]; n++; if(!top||g.opts[v][1]>top.p) top={name:g.name,p:g.opts[v][1]}; }
   h+='<fieldset class="fp"><legend>'+esc(g.name)+'</legend>'+g.opts.map(function(o,i){ return '<button class="opt slim" data-act="fp" data-g="'+g.k+'" data-v="'+i+'" aria-pressed="'+(v===i)+'"><span>'+esc(o[0])+'</span><span class="pts">'+o[1]+'</span></button>'; }).join('')+'</fieldset>'; });
  h+='<div class="fpres" aria-live="polite">'+(n===FOOTPRINT.length?'<p><strong>Your score: '+tot+' points</strong> (lowest possible is 4).</p><p>'+(top.p>1?'Your highest score is in <strong>'+esc(top.name)+'</strong>. One change there would help the most.':'All your choices are low impact. Great work!')+'</p>':'<p class="small">Answer all four groups to see your score.</p>')+'</div>';
  h+='<p><strong>My climate action pledge:</strong> two simple changes I will make.</p><label for="pl1">Change 1</label><input id="pl1" data-save="pledge.a" value="'+esc(S.pledge.a||'')+'"><label for="pl2">Change 2</label><input id="pl2" data-save="pledge.b" value="'+esc(S.pledge.b||'')+'">';
  return h; }
 return '';
}
function posToKm(p){ if(p<=30) return p/30*12; if(p<=55) return 12+(p-30)/25*38; if(p<=75) return 50+(p-55)/20*30; if(p<=92) return 80+(p-75)/17*620; return 700+(p-92)/8*300; }
function layerAt(km){ for(var i=0;i<ALT.length;i++) if(km<=ALT[i].to) return ALT[i]; return ALT[ALT.length-1]; }
function altInfo(km,L){ return '<p class="big">'+Math.round(km)+' km</p><p><strong>'+L.name+'</strong></p><p>'+esc(L.txt)+'</p>'; }
function sPractice(k){
 var C=S.cl[k];
 if(C.relearn && !S.ui){ return '<div class="card stack"><h2>Let’s look at this another way</h2><p>These ideas are tricky. A different kind of explanation often helps.</p><div class="row"><button class="btn" data-act="relearn">Open the lesson another way</button><button class="btn ghost" data-act="relearn-skip">Keep practising</button></div></div>'; }
 if(!S.ui || S.ui.cl!==k || S.ui.mode!=='prac') loadNextPractice(k);
 if(C.stage!=='practice') return sReady(k);
 var it=IT[S.ui.id];
 return '<div class="card stack"><div class="row between"><p class="eyebrow">Practice '+(C.pc+(S.ui.done?0:1))+' · Level '+C.level+' of 3</p>'+speakBtn('stem-'+it.id)+'</div>'+renderItem(it,'prac')+'</div>';
}
function sReady(k){
 var C=S.cl[k], more=poolLeft(k).length>0;
 return '<div class="card stack"><h2>'+(C.cp.tries?'Ready to try the checkpoint again?':'You’re ready for the checkpoint!')+'</h2><p>The checkpoint has 2 new questions. There are no hints, and you will say how sure you are.</p><div class="row"><button class="btn" data-act="start-cp">Start the checkpoint</button>'+(more?'<button class="btn ghost" data-act="more-practice">Practise a little more</button>':'')+'</div></div>';
}
function sCp(k){ var C=S.cl[k], it=IT[S.ui.id]; return '<div class="card stack"><div class="row between"><p class="eyebrow">Checkpoint '+(C.cp.idx+1)+' of '+C.cp.set.length+'</p>'+speakBtn('stem-'+it.id)+'</div>'+renderItem(it,'cp')+'</div>'; }
function sCpres(k){
 var C=S.cl[k];
 if(C.cp.passed) return '<div class="card stack center"><p class="badge big">'+ICON.badge+esc(CL[k].badge)+'</p><h2>Badge earned!</h2><p>You showed this in two new questions. Now try a challenge to use what you know.</p><div class="row"><button class="btn" data-act="to-apply">Go to the challenge</button></div></div>';
 return '<div class="card stack"><h2>Not quite yet, and that is fine</h2><p>'+(C.flag?'This mission is tricky. Your teacher will check in with you about it. You can still try the challenge.':'Let’s practise a little more, then try the checkpoint again.')+'</p><div class="row">'+(C.flag?'<button class="btn" data-act="to-apply">Go to the challenge</button>':'')+'<button class="btn'+(C.flag?' ghost':'')+'" data-act="more-practice">Practise more</button></div></div>';
}
function sApply(k){
 var h='<div class="card stack"><p class="eyebrow">Apply</p><h2>Use what you know</h2><p class="small">Write your answer first. Then open the scoring guide and tick the points you covered.</p>';
 TASKS[k].forEach(function(t){
  var open=S.rub[t.id]&&S.rub[t.id].open, ticks=(S.rub[t.id]&&S.rub[t.id].t)||[];
  h+='<div class="task"><p class="eyebrow">'+esc(t.kind)+'</p><p>'+esc(t.prompt)+'</p><label for="frq-'+t.id+'">My answer</label><textarea id="frq-'+t.id+'" rows="5" data-save="frq.'+t.id+'">'+esc(S.frq[t.id]||'')+'</textarea>'
   +'<button class="linkbtn" data-act="rubric" data-id="'+t.id+'" aria-expanded="'+!!open+'">'+(open?'Hide':'Open')+' the scoring guide</button>';
  if(open) h+='<div class="rubric"><p class="small">'+esc(t.scoring)+'</p>'+t.rubric.map(function(r,i){ var on=ticks.indexOf(i)>=0; return '<button class="opt check slim" data-act="tick" data-id="'+t.id+'" data-i="'+i+'" aria-pressed="'+on+'"><span class="box" aria-hidden="true">'+(on?'✓':'')+'</span><span>'+esc(r)+'</span></button>'; }).join('')+'<p class="small">Points I covered: <strong>'+ticks.length+'</strong></p></div>';
  h+='</div>';
 });
 return h+'<div class="row"><button class="btn" data-act="mfinish">Finish this mission</button></div></div>';
}
function sDone(k){
 var C=S.cl[k], next=recommended();
 return '<div class="card stack center">'+(C.status==='mastered'?'<p class="badge big">'+ICON.badge+esc(CL[k].badge)+'</p>':'')+'<h2>Mission '+CL[k].no+' complete</h2><p>You answered '+C.log.length+' questions'+(C.resolved.length?' and fixed '+C.resolved.length+' common idea'+(C.resolved.length>1?'s':''):'')+'.</p>'
 +(C.status!=='mastered'?'<p class="small">You can come back any time to earn the badge.</p>':'')+'<div class="row">'+(next?'<button class="btn" data-act="open" data-cl="'+next+'">Next: Mission '+CL[next].no+'</button>':'<button class="btn" data-act="finish">See my learning map</button>')+'<button class="btn ghost" data-act="tomap">Back to my map</button></div></div>';
}
function vFinish(){
 var h='<section class="stack"><div class="card stack"><p class="eyebrow">My learning map</p><h1 data-focus tabindex="-1">Well done, '+esc(S.name)+'</h1><p>Here is where you are now. Your map will keep changing as you learn.</p></div><div class="mgrid">';
 ORDER.forEach(function(k){ var C=S.cl[k];
  h+='<article class="card mcard"><p class="eyebrow">Mission '+CL[k].no+'</p><h3>'+esc(CL[k].name)+'</h3>'+meter(C.m)+(C.status==='mastered'?'<p class="badge">'+ICON.badge+esc(CL[k].badge)+'</p>':'<p class="small">Next step: '+(C.status==='new'?'start this mission.':'practise and take the checkpoint.')+'</p>')
   +(C.resolved.length?'<p class="small"><strong>Ideas you changed:</strong> '+C.resolved.map(function(m){return esc(MIS[m].think);}).join(' · ')+'</p>':'')+'</article>'; });
 h+='</div><div class="card stack"><p class="eyebrow">Thinking routine · I used to think… Now I think…</p><label for="rf1">I used to think…</label><textarea id="rf1" rows="2" data-save="reflect.used">'+esc(S.reflect.used||'')+'</textarea><label for="rf2">Now I think…</label><textarea id="rf2" rows="2" data-save="reflect.now">'+esc(S.reflect.now||'')+'</textarea>'
  +'<p class="eyebrow">Headlines</p><label for="rf3">Write a newspaper headline that sums up this chapter.</label><input id="rf3" data-save="reflect.headline" value="'+esc(S.reflect.headline||'')+'"></div>'
  +'<div class="card stack"><h2>Quick review</h2><p>Come back in a week and take a 4-question review. It helps you remember for longer.</p><div class="row"><button class="btn" data-act="review">Start a quick review</button><button class="btn ghost" data-act="tomap">Back to my map</button></div></div></section>';
 return h;
}
function vReview(){
 var R=S.review;
 if(R.idx>=R.set.length){ var ok=R.res.filter(function(x){return x.ok;}).length; return '<section class="card stack"><h1 data-focus tabindex="-1">Review done</h1><p>You remembered <strong>'+ok+' of '+R.set.length+'</strong>.</p><p class="small">Anything you missed is worth another look in its mission.</p><div class="row"><button class="btn" data-act="tomap">Back to my map</button></div></section>'; }
 var it=IT[R.set[R.idx]]; if(!S.ui||S.ui.id!==it.id) S.ui=newUI(it.id,'rev',it.cl);
 return '<section class="card stack"><p class="eyebrow">Quick review · '+(R.idx+1)+' of '+R.set.length+'</p><h1 class="vh" data-focus tabindex="-1">Review question</h1>'+renderItem(it,'rev')+'</section>';
}
function viewLearner(){
 var b = {welcome:vWelcome,k1:function(){return vK(1);},k2:function(){return vK(2);},howto:vHowto,diag:vDiag,map:vMap,mission:vMission,finish:vFinish,review:vReview}[S.view]();
 return rail()+b+'<footer class="foot">Content: NCERT, <em>Understanding Society: India and Beyond</em>, Grade 9 Part 1, Chapter 3. Data: Table 3.3. Diagrams drawn for this PAL.</footer>';
}

/* ---------- render ---------- */
function render(){
 app.innerHTML = viewLearner();
 var key = S.view+'|'+(S.mission||'')+'|'+(S.mission?S.cl[S.mission].stage:'')+'|'+(S.ui?S.ui.id:'')+'|'+(S.review?S.review.idx:'');
 if(key!==lastKey){ if(lastKey){ window.scrollTo(0,0); var f=app.querySelector('[data-focus]'); if(f) f.focus({preventScroll:true}); } lastKey=key; }
 save();
}

/* ---------- actions ---------- */
function setPath(path, val){ var p=path.split('.'), o=S; for(var i=0;i<p.length-1;i++){ var k=p[i]; if(o[k]==null||typeof o[k]!=='object') o[k]=(/^\d+$/.test(p[i+1])?[]:{}); o=o[k]; } o[p[p.length-1]]=val; }
function placeChip(ix, b){ var u=S.ui; if(u.done) return; var it=IT[u.id];
 if(b==='tray'){ delete u.sel[ix]; }
 else { if(it.order){ Object.keys(u.sel).forEach(function(k){ if(u.sel[k]===b && +k!==ix) delete u.sel[k]; }); } u.sel[ix]=b; }
 u.bad=u.bad.filter(function(x){return x!==ix;}); u.pick=null; u.tryMsg=false; }
var A = {
 start:function(){ if(!S.name.trim()){ document.getElementById('nmErr').hidden=false; document.getElementById('nm').focus(); return false; } logE('start',{}); if(S.diag.i>=DIAG.length){ S.view='map'; } else if(S.diag.i>0){ S.view='diag'; } else S.view= S.k1 ? (S.k2?'howto':'k2') : 'k1'; },
 kpick:function(t){ if(t.dataset.k==='1'){ S.k1=t.dataset.v; S.view='k2'; } else { S.k2=t.dataset.v; S.view='howto'; } },
 back:function(t){ S.view=t.dataset.to; },
 'go-diag':function(){ S.view='diag'; S.ui=null; },
 pick:function(t){ var u=S.ui; if(u.done) return false; u.sel=+t.dataset.i; u.tryMsg=false; },
 toggle:function(t){ var u=S.ui, i=+t.dataset.i, ix=u.sel.indexOf(i); if(u.done) return false; if(ix>=0) u.sel.splice(ix,1); else u.sel.push(i); u.tryMsg=false; },
 chip:function(t){ var u=S.ui, i=+t.dataset.i; u.pick = u.pick===i?null:i; },
 bucket:function(t){ var u=S.ui; if(u.pick==null){ toast('First tap a card to move.'); return false; } placeChip(u.pick, t.dataset.b); },
 tray:function(){ var u=S.ui; if(u.pick!=null) placeChip(u.pick,'tray'); },
 conf:function(t){ S.ui.conf=t.dataset.v; },
 'diag-next':function(){ var u=S.ui, it=IT[u.id], ok=u.sel===it.key;
  S.diag.ans[it.id]={choice:u.sel,correct:ok,conf:u.conf,mis:ok?null:it.mis[u.sel]}; logE('clue',{item:it.id,ok:ok,conf:u.conf});
  S.diag.i++; S.ui=null; if(S.diag.i>=DIAG.length){ computeRoutes(); S.view='map'; } },
 hint:function(){ S.ui.hints++; logE('hint',{item:S.ui.id}); },
 check:function(){ var u=S.ui, it=IT[u.id], r=evalItem(it,u.sel);
  if((u.mode==='prac'||u.mode==='warm') && !r.ok && u.att===0){ u.att=1; u.firstMis=r.mis; u.tryMsg=true; if(it.type==='mcq'){ u.wrongIdx=[u.sel]; u.sel=null; } if(it.type==='dnd') u.bad=r.bad.slice(); if(it.hint && u.hints<it.hint.length) u.hints++; return; }
  finishItem(r); },
 next:function(){ var u=S.ui;
  if(u.mode==='prac'){ var k=u.cl, C=S.cl[k]; S.ui=null; if(C.relearn) return; if(readyForCp(k)){ C.stage='ready'; } else loadNextPractice(k); return; }
  if(u.mode==='cp'){ var C2=S.cl[u.cl]; C2.cp.idx++; if(C2.cp.idx<C2.cp.set.length){ S.ui=newUI(C2.cp.set[C2.cp.idx],'cp',u.cl); } else evalCp(u.cl); return; }
  if(u.mode==='rev'){ S.review.idx++; S.ui=null; return; } },
 'prereq-done':function(){ var k=S.mission; S.cl[k].prereqDone=true; setStage(k, afterPrereq(k)); },
 'toggle-ans':function(){ S.showAns=!S.showAns; },
 open:function(t){ var k=t.dataset.cl, C=S.cl[k]; if(!C.route) return false; S.mission=k; S.view='mission'; if(C.status==='new') C.status='active'; if((C.status==='mastered'||C.status==='practised') && C.stage==='done'){ C.stage='learn'; S.ui=null; } if(C.stage==='practice' && !S.ui) loadNextPractice(k); },
 tomap:function(){ S.view='map'; S.ui=null; },
 mgo:function(){ var k=S.mission; setStage(k, firstStage(k)); },
 agree:function(t){ var C=S.cl[S.mission], code=C.mis[Math.min(C.ri,C.mis.length-1)]; C.agree[code]=t.dataset.v; logE('elicit',{cl:S.mission,mis:code,v:t.dataset.v}); },
 'repair-next':function(){ var k=S.mission, C=S.cl[k]; if(C.ri<C.mis.length-1){ C.ri++; } else setStage(k,'learn'); },
 'skip-practice':function(){ setStage(S.mission,'practice'); },
 tab:function(t){ S.cl[S.mission].tab=t.dataset.v; logE('rep',{cl:S.mission,rep:t.dataset.v}); },
 ctx:function(){ var i=0; K1.forEach(function(x,j){ if(x[0]===S.k1) i=j; }); S.k1=K1[(i+1)%K1.length][0]; toast('Stories now come from: '+K1[(i+1)%K1.length][1].toLowerCase()); },
 'to-practice':function(){ var k=S.mission; S.cl[k].relearnShown=false; setStage(k,'practice'); },
 relearn:function(){ var k=S.mission, C=S.cl[k], cur=C.tab||S.k2||'diagram', order=['diagram','story','steps','activity']; C.tab=order[(order.indexOf(cur)+1)%order.length]; C.relearn=false; C.relearnShown=true; C.stage='learn'; S.ui=null; },
 'relearn-skip':function(){ var k=S.mission; S.cl[k].relearn=false; loadNextPractice(k); },
 'start-cp':function(){ setStage(S.mission,'cp'); },
 'more-practice':function(){ var k=S.mission, C=S.cl[k]; C.pcAtFail=C.pc; C.stage='practice'; S.ui=null; loadNextPractice(k); if(C.stage!=='practice'){ toast('You have tried every practice question. Try the checkpoint again.'); } },
 'to-apply':function(){ S.cl[S.mission].stage='apply'; },
 rubric:function(t){ var id=t.dataset.id; S.rub[id]=S.rub[id]||{t:[]}; S.rub[id].open=!S.rub[id].open; },
 tick:function(t){ var id=t.dataset.id, i=+t.dataset.i, r=S.rub[id], ix=r.t.indexOf(i); if(ix>=0) r.t.splice(ix,1); else r.t.push(i); },
 mfinish:function(){ var k=S.mission, C=S.cl[k]; if(C.status!=='mastered') C.status='practised'; C.stage='done'; logE('mission-done',{cl:k,status:C.status}); },
 finish:function(){ S.view='finish'; },
 review:function(){ var set=[]; ORDER.forEach(function(k){ var good=S.cl[k].log.filter(function(x){return x.E>=0.7 && IT[x.id].use==='prac';}); var pick=good.length?good[0].id:null; if(!pick){ var any=ITEMS.filter(function(i){return i.cl===k&&i.use==='prac';}); pick=any[0].id; } set.push(pick); }); S.review={set:set,idx:0,res:[]}; S.view='review'; S.ui=null; },
 breeze:function(t){ S.breeze=t.dataset.v; },
 mseason:function(t){ S.mseason=t.dataset.v; },
 fp:function(t){ S.fp[t.dataset.g]=+t.dataset.v; },
 speak:function(t){ var el=document.getElementById(t.dataset.target); try{ var ss=window.speechSynthesis; if(!ss) throw 0; if(ss.speaking){ ss.cancel(); return false; } var ut=new SpeechSynthesisUtterance(el?el.innerText:''); ut.lang='en-IN'; ut.rate=0.92; ss.speak(ut); }catch(e){ toast('Read aloud is not available in this browser.'); } return false; },
 size:function(t){ S.scale=Math.min(1.4,Math.max(0.9, r2(S.scale+0.1*(+t.dataset.d)))); applyScale(); },
};
function onClick(e){ var t=e.target.closest('[data-act]'); if(!t || t.disabled) return; var f=A[t.dataset.act]; if(!f) return; var r=f(t); if(r!==false) render(); }
document.addEventListener('click', onClick);
app.addEventListener('input', function(e){ var t=e.target;
 if(t.dataset.save){ setPath(t.dataset.save, t.value); save(); if(t.id==='nm') document.getElementById('nmErr').hidden=true; }
 if(t.dataset.range==='alt'){ S.alt=+t.value; var km=posToKm(S.alt); document.getElementById('altFig').innerHTML=SVGS.layers({km:km}); document.getElementById('altInfo').innerHTML=altInfo(km,layerAt(km)); t.setAttribute('aria-valuetext',Math.round(km)+' kilometres'); save(); }
});
app.addEventListener('change', function(e){ var t=e.target; if(t.dataset.change==='override'){ var k=t.dataset.cl, C=S.cl[k]; setRoute(k,t.value); C.override=true; if(C.status!=='mastered'){ C.stage='intro'; if(S.ui&&S.ui.cl===k) S.ui=null; } logE('override',{cl:k,route:t.value}); toast('Route changed for Mission '+CL[k].no+'.'); render(); } });
app.addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.id==='nm'){ e.preventDefault(); if(A.start()!==false) render(); } });
app.addEventListener('dragstart', function(e){ var c=e.target.closest('.dchip'); if(!c||!S.ui) return; S.ui.pick=+c.dataset.i; try{ e.dataTransfer.setData('text/plain', c.dataset.i); e.dataTransfer.effectAllowed='move'; }catch(x){} });
app.addEventListener('dragover', function(e){ if(e.target.closest('[data-drop]')) e.preventDefault(); });
app.addEventListener('drop', function(e){ var d=e.target.closest('[data-drop]'); if(!d||!S.ui||S.ui.pick==null) return; e.preventDefault(); placeChip(S.ui.pick, d.dataset.drop); render(); });

applyScale();
if(S.view==='mission' && S.mission){ var C0=S.cl[S.mission]; if(C0.stage==='practice' && !S.ui) loadNextPractice(S.mission); }
render();
})();

</script>
