<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky to Soil Teacher View</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Baloo+2:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a sky-to-soil band header over one calm reading column (860px learner, 1180px teacher). */
:root{
  --bg:#EAF1F5; --surface:#FFFFFF; --surface-2:#F3F8FA; --ink:#102335; --muted:#4B6073; --line:#CFDCE5;
  --accent:#0A6C8C; --accent-ink:#FFFFFF; --accent-soft:#D6ECF4;
  --earth:#8E531C; --earth-soft:#F5E7D6; --good:#2B7448; --good-soft:#DDF0E3; --warn:#9A620E; --warn-soft:#FAEED6;
  --heat:#C0412C; --rain:#2C79B0; --sun:#E0A100;
  --band1:#E4F2F9; --band2:#D0E6F3; --band3:#BAD8EC; --band4:#A3C7E3; --band5:#8DB5DA;
  --head-bg:#0D2840; --head-ink:#EAF3F9; --head-line:#2E4E6B;
  --st1:#9ED8F3; --st2:#5DB4DE; --st3:#2F86B8; --st4:#E7B04B; --st5:#8E531C;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --scale:1; --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1521; --surface:#112131; --surface-2:#0E1B29; --ink:#E3EDF5; --muted:#9AB0C3; --line:#23394D;
  --accent:#55B6D8; --accent-ink:#04131C; --accent-soft:#123447;
  --earth:#DE9F62; --earth-soft:#2C2015; --good:#6CC495; --good-soft:#123024; --warn:#E3B15C; --warn-soft:#30260F;
  --heat:#F07B63; --rain:#62AFE6; --sun:#F2C14E;
  --band1:#13293C; --band2:#173249; --band3:#1C3C58; --band4:#214668; --band5:#275079;
  --head-bg:#06101A; --head-ink:#E3EDF5; --head-line:#1F3448; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1521; --surface:#112131; --surface-2:#0E1B29; --ink:#E3EDF5; --muted:#9AB0C3; --line:#23394D;
  --accent:#55B6D8; --accent-ink:#04131C; --accent-soft:#123447;
  --earth:#DE9F62; --earth-soft:#2C2015; --good:#6CC495; --good-soft:#123024; --warn:#E3B15C; --warn-soft:#30260F;
  --heat:#F07B63; --rain:#62AFE6; --sun:#F2C14E;
  --band1:#13293C; --band2:#173249; --band3:#1C3C58; --band4:#214668; --band5:#275079;
  --head-bg:#06101A; --head-ink:#E3EDF5; --head-line:#1F3448; color-scheme:dark; }

html{font-size:calc(16px * var(--scale))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head-bg)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.teacher .wrap{max-width:1180px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:2rem;font-weight:700} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.2rem;font-weight:600}
p{margin:0} ul,ol{margin:0}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.small{font-size:.88rem;color:var(--muted)}
.lead{font-size:1.12rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
[data-focus]:focus{outline:none}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head-bg);color:var(--head-ink)}
.top-in{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:1.3rem;line-height:1;display:block}
.brand small{display:block;opacity:.78;font-size:.76rem;margin-top:2px}
.hbtn{font:inherit;font-size:.88rem;font-weight:700;color:var(--head-ink);background:transparent;border:1px solid var(--head-line);border-radius:999px;padding:6px 12px;cursor:pointer;min-height:36px}
.hbtn:hover{border-color:var(--head-ink)}
.hbtn[aria-pressed="true"]{background:var(--head-ink);color:var(--head-bg)}
.hctl{display:flex;gap:6px}
.strata{display:flex;height:6px}.strata i{flex:1}
.strata i:nth-child(1){background:var(--st1)}.strata i:nth-child(2){background:var(--st2)}.strata i:nth-child(3){background:var(--st3)}.strata i:nth-child(4){background:var(--st4)}.strata i:nth-child(5){background:var(--st5)}
main{padding-block:18px 64px;display:grid;gap:16px}

/* journey rail */
.rail ol{list-style:none;padding:0;display:flex;gap:4px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.rail li{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;border-radius:999px}
.rail .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.rail li.done .dot{background:var(--good);border-color:var(--good)}
.rail li.now{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.rail li.now .dot{background:var(--accent);border-color:var(--accent)}

/* cards & layout */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3.2vw,26px);min-width:0}
.stack{display:grid;gap:14px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{text-align:center;justify-items:center}
.hero{padding:0;overflow:hidden}
.hero .stack{padding:clamp(16px,3.2vw,28px)}
.hero-art{display:block;width:100%;height:150px}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.list{padding-left:1.2em;display:grid;gap:6px}
.foot{font-size:.8rem;color:var(--muted);padding-top:8px}

/* form */
label{font-weight:700;font-size:.95rem;display:block}
input:not([type=range]),textarea,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink)}
textarea{resize:vertical}
select{width:auto;padding:6px 8px;font-size:.88rem}
.field{display:grid;gap:6px;max-width:420px}
.err{color:var(--heat);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}

/* buttons */
.btn{font:inherit;font-weight:700;border-radius:999px;padding:10px 20px;min-height:44px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:var(--heat);border-color:var(--heat);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.06)}
.linkbtn{font:inherit;font-size:.9rem;font-weight:700;background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;display:inline-flex;gap:6px;align-items:center}
.chip{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.tag{font-size:.78rem;font-weight:700;color:var(--earth);background:var(--earth-soft);border-radius:999px;padding:4px 10px}

/* items */
.item{display:grid;gap:14px;min-width:0}
.stem{font-size:1.1rem;font-weight:700;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .let,.opt .box{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-family:var(--f-mono);font-size:.85rem}
.opt[aria-pressed="true"] .let,.opt[aria-pressed="true"] .box{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .let,.opt.right .box{background:var(--good);color:var(--surface);border-color:var(--good)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft);border-style:dashed}
.opt.missed{border-color:var(--good);border-style:dashed}
.opt:disabled{cursor:default}
.opt:disabled:not(.right):not(.wrong):not(.missed){opacity:.6}
.opt.slim{padding:8px 12px;min-height:40px}
.opt .pts{margin-left:auto;font-family:var(--f-mono);color:var(--muted)}
.tagm{font-style:normal;color:var(--good);font-size:.85rem}
.actions{padding-top:2px}
.fb{border-radius:12px;padding:14px 16px;border:1px solid var(--line);background:var(--surface-2);display:grid;gap:10px}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.try{background:var(--warn-soft);border-color:var(--warn)}
.fb.learn{background:var(--accent-soft);border-color:var(--accent)}
.myth{border-left:4px solid var(--earth);padding:8px 12px;background:var(--surface);border-radius:0 10px 10px 0;display:grid;gap:6px}
.hints{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:12px 14px;border:1px dashed var(--line)}
.case{background:var(--earth-soft);border-radius:12px;padding:12px 16px;display:grid;gap:6px}
.claim{font-family:var(--f-display);font-size:1.35rem;margin:0;padding:8px 0 8px 16px;border-left:4px solid var(--earth)}

/* drag & drop */
.dnd{display:grid;gap:10px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;align-items:center}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.buckets.ordered{grid-template-columns:1fr}
.buckets.ordered .bucket{display:flex;gap:10px;align-items:center;min-height:52px}
.buckets.ordered .bhead{flex:none;width:110px}
.bucket{border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--surface-2);display:grid;gap:8px;align-content:start;min-height:92px;min-width:0}
.bucket.target{border-style:dashed;border-color:var(--accent)}
.bhead{font:inherit;font-weight:700;font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink);cursor:pointer;text-align:left}
.bucket.target .bhead{border-color:var(--accent);color:var(--accent)}
.bin{display:flex;flex-wrap:wrap;gap:6px}
.dchip{font:inherit;font-size:.92rem;border:1.5px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:grab;text-align:left;max-width:100%}
.dchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dchip.bad{border-style:dashed;border-color:var(--warn)}
.dchip.ok{border-color:var(--good);background:var(--good-soft)}
.dchip em{font-style:normal;font-size:.82rem;color:var(--good)}

/* meters, pills, badges */
.meter-row{display:flex;gap:10px;align-items:center}
.meter{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--st2),var(--good));border-radius:99px}
.meter.thin{height:6px}
.meter-l{font-size:.85rem;font-weight:700;white-space:nowrap}
.pill{font-size:.78rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.pill.mastered{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.pill.active,.pill.route{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.badge{display:inline-flex;gap:8px;align-items:center;font-weight:700;color:var(--earth);background:var(--earth-soft);border-radius:999px;padding:6px 14px}
.badge.big{font-size:1.05rem;padding:10px 18px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.mcard{display:grid;gap:10px;align-content:start}
.mcard.rec{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.path{font-size:.95rem}
.mhead{display:grid;gap:12px}
.mlist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.mstep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-height:56px;cursor:pointer}
.mstep:hover{border-color:var(--accent)}
.mstep .n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);background:var(--surface-2)}
.mstep.done .n{background:var(--good);border-color:var(--good);color:var(--surface)}
.mstep.now{border-color:var(--accent)}
.mstep.now .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mstep .t{flex:1;font-weight:700;min-width:0}
.mstep .s{font-size:.85rem;color:var(--muted);white-space:nowrap}
.why{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px}

/* lessons */
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{font:inherit;font-weight:700;font-size:.95rem;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--muted);cursor:pointer;min-height:44px}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{display:grid;gap:14px;min-width:0}
.steps{padding-left:1.4em;display:grid;gap:8px}
.steps li::marker{font-family:var(--f-mono);color:var(--accent);font-weight:500}
.story{font-size:1.06rem;line-height:1.75;max-width:65ch}
.we{background:var(--good-soft);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.we ol{padding-left:1.3em;display:grid;gap:4px}
.farm{background:var(--earth-soft);border:1px solid var(--earth);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.farm .eyebrow{color:var(--earth)}
.words summary{font-weight:700;cursor:pointer;padding:6px 0}
.words dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:8px 0 0}
.words dt{font-weight:700}.words dd{margin:0}
.routine{border:1.5px dashed var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.vid{display:flex;gap:14px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.vid > div{display:grid;gap:4px;min-width:0}
.vid-ph{flex:none;width:72px;height:52px;border-radius:10px;background:var(--head-bg);color:var(--head-ink);display:grid;place-items:center;font-size:1.2rem}
.task{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.rubric{display:grid;gap:6px}
.fp{border:0;padding:0;margin:0;display:grid;gap:6px}
.fp legend{font-weight:700;padding:0 0 4px}
.fpres{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.altgrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:center}
.altinfo{display:grid;gap:6px;background:var(--surface-2);border-radius:12px;padding:14px}
.altinfo .big{font-family:var(--f-mono);font-size:1.6rem;font-variant-numeric:tabular-nums}
@media (max-width:560px){ .altgrid{grid-template-columns:1fr} .buckets.ordered .bhead{width:80px} h1{font-size:1.7rem} }
.anslist{padding-left:1.3em;display:grid;gap:12px}

/* figures */
.figbox{margin:0;display:grid;gap:6px;min-width:0}
.figbox figcaption{font-size:.86rem;color:var(--muted)}
.fig{width:100%;height:auto;display:block;max-width:560px}
.fig.tall{max-width:400px}.fig.small{max-width:240px}
.stim{background:var(--surface-2);border-radius:12px;padding:10px}
.t{fill:var(--ink);font:13px var(--f-body)}
.t-b{fill:var(--ink);font:700 13px var(--f-body)}
.t-sm{fill:var(--muted);font:12px var(--f-body)}
.t-sm2{fill:var(--ink);font:12px var(--f-body);opacity:.85}
.t-xs{fill:var(--ink);font:11px var(--f-body);opacity:.85}
.t-xs-e{fill:var(--earth);font:700 11px var(--f-body)}
.t-oe{fill:var(--earth-soft);font:700 11px var(--f-body)}
.tag-n .t-xs{fill:var(--rain);font-weight:700;opacity:1}
.t-w{fill:var(--ink);font:700 12px var(--f-body)}
.t-big{fill:var(--ink);font:700 20px var(--f-display)}
.t-bar{fill:var(--ink);font:700 11px var(--f-body)}

/* tables */
.tw{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.data caption{caption-side:bottom;text-align:left;font-size:.82rem;color:var(--muted);padding-top:6px}
table.bank td{min-width:110px}
table.bank td:nth-child(7),table.bank td:nth-child(8){min-width:260px}
table.bank p{margin-bottom:6px;color:var(--ink)}
tr.sub td{border-bottom-style:dashed;padding-top:0}
code{font-family:var(--f-mono);font-size:.78rem;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.ok{color:var(--good);font-weight:700}.no{color:var(--warn);font-weight:700}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}.kv dt{font-weight:700}.kv dd{margin:0}
table.hess td{text-align:center;min-width:120px}
table.hess td.on{background:var(--accent-soft)}
table.hess .n{display:block;font-family:var(--f-mono);font-size:1.2rem;color:var(--accent)}
table.hess .ids{display:block;font-size:.72rem;color:var(--muted)}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.imggrid .figbox{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface-2)}
.bench{list-style:none;padding:0;display:grid;gap:8px}
.bench li{display:flex;gap:12px;align-items:flex-start}
.bench .st{flex:none;width:64px;text-align:center;font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 0}
.bench li.met .st{background:var(--good-soft);color:var(--good)}
.bench li.review .st{background:var(--warn-soft);color:var(--warn)}
.bench li.pending .st{background:var(--earth-soft);color:var(--earth)}
.tabs.t{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 6px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-in">

{id:"WEA-P3",use:"prac",cl:"WEA",c:"WEA_01",lo:"LO3",comp:"Sorts statements into weather and climate.",bl:"Understand",dok:2,diff:"Easy",lv:1,type:"dnd",

{id:"WEA-P4",use:"prac",cl:"WEA",c:"WEA_04",lo:"LO3",comp:"Explains how heating changes air pressure and the weather.",bl:"Understand",dok:2,diff:"Moderate",lv:2,type:"mcq",

 mis:["M_WEA_HOT_HIGH","M_WEA_HOT_HIGH",null,null],

{id:"WEA-P5",use:"prac",cl:"WEA",c:"WEA_03",lo:"LO3",comp:"Identifies what happens on a humid day.",bl:"Understand",dok:2,diff:"Moderate",lv:2,type:"multi",

{id:"WEA-P6",use:"prac",cl:"WEA",c:"WEA_05",lo:"LO4",comp:"Predicts the direction and strength of a night-time breeze.",bl:"Apply",dok:2,diff:"Moderate",lv:2,type:"mcq",

 opts:["Sea to land, and quite gentle","Land to sea, and quite strong","Land to sea, and quite gentle","Sea to land, and quite strong"],key:2,

{id:"WEA-P7",use:"prac",cl:"WEA",c:"WEA_05",lo:"LO4",comp:"Puts the steps of a sea breeze in order.",bl:"Understand",dok:2,diff:"Moderate",lv:2,type:"dnd",order:true,

{id:"WEA-P8",use:"prac",cl:"WEA",c:"WEA_02",lo:"LO3",comp:"Reads temperature data to find the most even climate and explains why.",bl:"Analyze",dok:3,diff:"Difficult",lv:3,type:"mcq",

{id:"WEA-P9",use:"prac",cl:"WEA",c:"WEA_01",lo:"LO3",comp:"Judges a claim that confuses one day’s weather with climate.",bl:"Evaluate",dok:3,diff:"Difficult",lv:3,type:"mcq",

 why:["Uses one day of weather as climate.","Key.","The monsoon season is June to September.","Rain is one of the elements of climate."],
 mis:["M_WEA_SHORT_CLIMATE",null,null,"M_WEA_SHORT_CLIMATE"],
 hint:["How long a time does climate describe?","Delhi’s average March rain is only about 1.3 cm."],
 exp:"One rainy day is weather. Climate is the average over 30 years or more. Delhi’s March is usually dry."},
{id:"WEA-C1",use:"chk",cl:"WEA",c:"WEA_04",lo:"LO3",comp:"Uses a pressure map to predict wind direction.",bl:"Apply",dok:2,diff:"Moderate",lv:2,type:"mcq",

{id:"WEA-C2",use:"chk",cl:"WEA",c:"WEA_05",lo:"LO4",comp:"Compares coastal and inland places using land and sea heating.",bl:"Analyze",dok:3,diff:"Difficult",lv:3,type:"mcq",

{id:"MON-P1",use:"prac",cl:"MON",c:"MON_01",lo:"LO5",comp:"Recalls the order of the four IMD seasons.",bl:"Remember",dok:1,diff:"Easy",lv:1,type:"mcq",

{id:"MON-P3",use:"prac",cl:"MON",c:"MON_02",lo:"LO6",comp:"Explains why moist winds blow from sea to land in summer.",bl:"Understand",dok:2,diff:"Moderate",lv:2,type:"mcq",

  steps:["Weather is what the air is like hour by hour and day by day.","Climate is the usual weather of a large area over a long time, usually 30 years or more.","Five elements shape weather and climate: temperature, humidity, precipitation, air pressure and wind.","Temperature depends on insolation, the sunlight the Earth receives. The Sun’s rays fall most directly near the equator, so it is hottest there.","Humidity is water vapour in the air. Warm air can hold more of it. On humid days, sweat and clothes dry slowly.","Precipitation is water falling from the sky: drizzle, rain, snow, sleet or hail. Most groundwater comes from rain.","Warm air rises and makes low pressure, with cloudy, wet weather. Cool air sinks and makes high pressure, with clear skies.","Wind is air moving from high pressure to low pressure. A wind is named after the direction it comes from.","In the day, land heats faster than the sea, so a sea breeze blows from sea to land. At night, land cools faster, so a gentle land breeze blows from land to sea."],

 {id:"V06",cl:"WEA",title:"How pressure makes wind",min:"2:30",style:"Animation + incense-smoke demo",use:"Learn; Fix-an-idea (hot = high pressure; wind names)",hess:"Understand · DOK 2",points:["Warm air rises → low pressure → clouds","Cool air sinks → high pressure → clear skies","Wind blows from high to low","Winds are named after where they come from"],short:"Warm air rises and makes low pressure. Cool air sinks and makes high pressure. Wind blows from high to low and is named after where it comes from."},
 {id:"V07",cl:"WEA",title:"Sea breeze and land breeze",min:"2:00",style:"Animation at a coastal farm, day and night",use:"Learn · Foundation",hess:"Apply · DOK 2",points:["Land heats and cools faster than water","Day: sea → land","Night: gentle land → sea"],short:"In the day, land heats faster, so a sea breeze blows from sea to land. At night, land cools faster, so a gentle land breeze blows out to sea."},
 {id:"V08",cl:"MON",title:"How the monsoon works",min:"3:30",style:"Animation: summer and winter wind patterns (schematic, no political map)",use:"Learn · Foundation; Fix-an-idea (monsoon = rain; pressure flip)",hess:"Understand · DOK 2",points:["Mausim means season","Summer: hot land, low pressure, sea-to-land winds","Winter: cool land, high pressure, land-to-sea winds","Bay of Bengal moisture → Tamil Nadu rain"],short:"In summer the land heats faster, so moist winds blow in from the sea. In winter the land cools faster, so winds blow out to sea and pick up moisture over the Bay of Bengal."},
 {id:"V09",cl:"MON",title:"Monsoon and the farmer",min:"3:00",style:"Short documentary: farmer interview, first rains, sowing, wells and reservoirs",use:"Farm connection · all routes",hess:"Analyze · DOK 2–3",points:["Sowing waits for the rains","Good monsoon: food, water, jobs","Floods and droughts","How farmers use forecasts"],short:"Farmers wait for the monsoon to sow. A good monsoon fills wells and reservoirs and means enough food. Too much rain floods fields; too little causes drought."},
 {id:"V10",cl:"MON",title:"Predicting rain: then and now",min:"3:00",style:"Illustrated explainer",use:"Learn · Guided/Challenge; Fix-an-idea (forecasts control weather)",hess:"Understand · DOK 2",points:["Kṛiṣhiparāśhara: Sun and Moon","Bṛihatsaṁhitā: nakṣhatras","Arthaśhāstra rain measurements; Meghadūtam","IMD, National Monsoon Mission, Mission Mausam"],short:"Ancient Indian books predicted rain using the Sun, Moon and nakṣhatras. Today, the National Monsoon Mission and Mission Mausam use computer models. Forecasts warn us; they cannot change the weather."},
 {id:"V11",cl:"CLC",title:"The greenhouse effect",min:"2:00",style:"Animation",use:"Learn; Fix-an-idea (ozone hole; stronger Sun)",hess:"Understand · DOK 2",points:["Sunlight in, heat out","Greenhouse gases trap heat","Human sources: fuel, forests, factories","Not the same as the ozone layer"],short:"Sunlight warms the Earth, and the Earth gives off heat. Greenhouse gases trap some of this heat. Burning fuel and cutting forests add more of these gases."},

 {id:"V13",cl:"CLC",title:"My carbon footprint challenge",min:"2:00",style:"Student-led vlog",use:"Apply · project",hess:"Create · DOK 3–4",points:["Score yourself","Pick two pledges","Track for a week","Score again"],short:"A student scores her footprint, makes two pledges, tracks them for a week and scores again."}

/* ===== Sky to Soil PAL · teacher view: every learner's progress, read from the class store ===== */
(function(){
'use strict';
document.body.classList.add('teacher');
var app = document.getElementById('app');
var PWKEY = 'sky2soil-teacher-pw';
var DIAG = ITEMS.filter(function(i){ return i.use==='diag'; });
var LET = 'ABCDEF';
var ROUTE = {foundation:'Step-by-step path',guided:'Guided path',repair:'Fix-an-idea path',extend:'Challenge path',confirm:'Quick-check path'};
var STATUS = {'new':'Not started',active:'In progress',practised:'Practised',mastered:'Mastered'};
var T = {pw:readPw(), list:null, loaded:null, err:'', busy:false, cls:'all', q:'', sort:'cls', open:null, scale:1};

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function readPw(){ try{ return sessionStorage.getItem(PWKEY)||''; }catch(e){ return ''; } }
function writePw(v){ try{ if(v) sessionStorage.setItem(PWKEY,v); else sessionStorage.removeItem(PWKEY); }catch(e){} }
function pct(m){ return Math.round((m||0)*100)+'%'; }
function band(m){ return m>=0.9?'Provisional mastery':m>=0.8?'Proficient':m>=0.6?'Developing':m>=0.4?'Emerging':'Beginning'; }
function when(iso){ if(!iso) return '—'; var d=new Date(iso); return isNaN(d)?'—':d.toLocaleString(undefined,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
function cl(L,k){ return (L.state.cl&&L.state.cl[k])||{status:'new',m:0,mis:[],resolved:[],log:[],cp:{}}; }
function quiz(L){ var a=(L.state.diag&&L.state.diag.ans)||{}, n=0, ok=0; DIAG.forEach(function(d){ if(a[d.id]){ n++; if(a[d.id].correct) ok++; } }); return {n:n,ok:ok}; }
function flagged(L){ return ORDER.some(function(k){ return cl(L,k).flag; }); }
function held(L){ var out=[]; ORDER.forEach(function(k){ (cl(L,k).mis||[]).forEach(function(c){ if(out.indexOf(c)<0) out.push(c); }); }); return out; }
function mastered(L){ return ORDER.filter(function(k){ return cl(L,k).status==='mastered'; }).length; }

/* ---------- loading ---------- */
function load(){
 T.busy=true; T.err=''; render();
 fetch('api/learners',{headers:{'x-teacher-password':T.pw},cache:'no-store'})
 .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {r:r,j:j}; }); })
 .then(function(x){
  T.busy=false;
  if(x.r.status===401){ T.pw=''; writePw(''); T.list=null; T.err='That password is not right. Please try again.'; }
  else if(!x.r.ok){ T.err=x.j.error||('The server answered '+x.r.status+'.'); }
  else { T.list=x.j.learners||[]; T.loaded=new Date().toISOString(); }
  render();
 })
 .catch(function(){ T.busy=false; T.err='Could not reach the server. Check your internet connection and try again.'; render(); });
}

/* ---------- views ---------- */
function vLogin(){
 return '<section class="card stack" style="max-width:520px"><p class="eyebrow">Teachers only</p><h1 data-focus tabindex="-1">Class progress</h1>'
 +'<p>Type the teacher password to see how each learner is doing.</p>'
 +'<form class="stack" data-form="login"><div class="field"><label for="pw">Teacher password</label><input id="pw" type="password" autocomplete="current-password" required></div>'
 +(T.err?'<p class="err" role="alert">'+esc(T.err)+'</p>':'')
 +'<div class="row"><button class="btn"'+(T.busy?' disabled':'')+'>'+(T.busy?'Opening…':'Open class view')+'</button></div></form></section>';
}
function visible(){
 var q=T.q.trim().toLowerCase();
 var list=T.list.filter(function(L){ return (T.cls==='all' || (L.cls||'')===T.cls) && (!q || (L.name||'').toLowerCase().indexOf(q)>=0); });
 var by={
  name:function(a,b){ return (a.name||'').localeCompare(b.name||''); },
  cls:function(a,b){ return (a.cls||'').localeCompare(b.cls||'',undefined,{numeric:true}) || (a.name||'').localeCompare(b.name||''); },
  recent:function(a,b){ return (b.updated||'').localeCompare(a.updated||''); },
  help:function(a,b){ return (flagged(b)-flagged(a)) || (held(b).length-held(a).length) || (a.name||'').localeCompare(b.name||''); }
 };
 return list.sort(by[T.sort]);
}
function vClass(){
 var all=T.list, list=visible(), classes=[];
 all.forEach(function(L){ if(L.cls && classes.indexOf(L.cls)<0) classes.push(L.cls); });
 classes.sort(function(a,b){ return a.localeCompare(b,undefined,{numeric:true}); });
 var h='<section class="stack"><div class="row between"><div><p class="eyebrow">Teachers only</p><h1 data-focus tabindex="-1">Class progress</h1></div>'
 +'<div class="row"><button class="btn ghost" data-act="refresh"'+(T.busy?' disabled':'')+'>'+(T.busy?'Refreshing…':'Refresh')+'</button><button class="btn ghost" data-act="csv"'+(list.length?'':' disabled')+'>Download CSV</button><button class="linkbtn" data-act="signout">Sign out</button></div></div>'
 +'<p class="small">Updated '+when(T.loaded)+'. Learners appear here a few seconds after they type their name and start.</p>'
 +(T.err?'<p class="err" role="alert">'+esc(T.err)+'</p>':'')+'</section>';
 if(!all.length) return h+'<section class="card stack"><h2>No learners yet</h2><p>When students open the app and type their name, they will show up here. Press Refresh to check again.</p></section>';

 h+='<section class="card row" aria-label="Filters"><div class="field" style="flex:1 1 200px"><label for="q">Find a learner</label><input id="q" type="search" data-f="q" value="'+esc(T.q)+'" placeholder="Type a name"></div>'
 +'<div class="field"><label for="fcls">Class</label><select id="fcls" data-f="cls"><option value="all">All classes</option>'+classes.map(function(c){ return '<option'+(T.cls===c?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></div>'
 +'<div class="field"><label for="fsort">Sort by</label><select id="fsort" data-f="sort">'+[['cls','Class, then name'],['name','Name'],['recent','Most recently active'],['help','Needs help first']].map(function(o){ return '<option value="'+o[0]+'"'+(T.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'; }).join('')+'</select></div></section>';

 var q=list.filter(function(L){ return quiz(L).n>=DIAG.length; }).length, mt=0, fl=list.filter(flagged);
 list.forEach(function(L){ mt+=mastered(L); });
 h+='<section class="mgrid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))" aria-label="Summary">'
 +tile(list.length,'learners shown')+tile(q,'finished the starting quiz')+tile(mt+' / '+list.length*ORDER.length,'missions mastered')+tile(fl.length,'need a check-in')+'</section>';

 var counts={};
 list.forEach(function(L){ held(L).forEach(function(c){ counts[c]=(counts[c]||0)+1; }); });
 var top=Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; });
 if(fl.length || top.length){
  h+='<section class="card stack"><h2>Needs attention</h2>';
  if(fl.length) h+='<p><strong>Stuck after two checkpoint tries:</strong> '+fl.map(function(L){ return '<button class="linkbtn" data-act="open" data-id="'+esc(L.id)+'">'+esc(L.name||'(no name)')+'</button>'; }).join(', ')+'</p>';
  if(top.length) h+='<div class="tw"><table class="data"><thead><tr><th>Idea learners still hold</th><th>Mission</th><th>Learners</th></tr></thead><tbody>'
   +top.slice(0,8).map(function(c){ var M=MIS[c]; return '<tr><td>“'+esc(M?M.think:c)+'”</td><td>'+esc(M&&CL[M.cl]?CL[M.cl].name:'')+'</td><td class="num">'+counts[c]+'</td></tr>'; }).join('')+'</tbody></table></div>';
  h+='</section>';
 }

 h+='<section class="card stack"><h2>Learners</h2><div class="tw"><table class="data"><thead><tr><th>Name</th><th>Class</th><th>Last active</th><th>Starting quiz</th>'
 +ORDER.map(function(k){ return '<th>'+CL[k].no+'. '+esc(CL[k].name)+'</th>'; }).join('')+'</tr></thead><tbody>';
 h+=list.map(function(L){ var z=quiz(L);
  return '<tr><td><button class="linkbtn" data-act="open" data-id="'+esc(L.id)+'">'+esc(L.name||'(no name)')+'</button></td><td>'+esc(L.cls||'—')+'</td><td class="num">'+when(L.updated)+'</td>'
  +'<td class="num">'+(z.n?z.ok+' / '+z.n+' right':'Not started')+'</td>'
  +ORDER.map(function(k){ var C=cl(L,k), st=C.status||'new';
   return '<td><span class="pill'+(st==='mastered'?' mastered':st==='active'||st==='practised'?' active':'')+'">'+STATUS[st]+'</span>'+(C.route?'<div class="small">'+pct(C.m)+(C.flag?' · <strong class="no">check in</strong>':'')+'</div>':'')+'</td>';
  }).join('')+'</tr>';
 }).join('');
 h+='</tbody></table></div>'+(list.length?'':'<p>No learners match these filters.</p>')+'</section>';
 return h;
}
function tile(n,label){ return '<div class="card stack" style="gap:2px"><span style="font-family:var(--f-display);font-size:2rem;font-weight:700;line-height:1">'+esc(n)+'</span><span class="small">'+esc(label)+'</span></div>'; }

function vLearner(L){
 var S=L.state, z=quiz(L);
 var h='<section class="stack"><div><button class="linkbtn" data-act="back">← Back to class</button></div>'
 +'<div class="row between"><div><p class="eyebrow">'+esc(L.cls?'Class '+L.cls:'No class given')+' · Last active '+when(L.updated)+'</p><h1 data-focus tabindex="-1">'+esc(L.name||'(no name)')+'</h1></div>'
 +'<button class="btn ghost" data-act="delete" data-id="'+esc(L.id)+'">Remove learner</button></div></section>';

 h+='<section class="mgrid">'+ORDER.map(function(k){ var C=cl(L,k), log=C.log||[], prac=log.filter(function(x){ return x.mode!=='cp'; }), first=prac.filter(function(x){ return x.ok && !x.att; }).length;
  var s='<div class="card mcard"><p class="eyebrow">Mission '+CL[k].no+'</p><h2>'+esc(CL[k].name)+'</h2><div class="row"><span class="pill'+(C.status==='mastered'?' mastered':'')+'">'+STATUS[C.status||'new']+'</span>'+(C.route?'<span class="pill route">'+esc(ROUTE[C.route]||C.route)+(C.override?' (changed by teacher)':'')+'</span>':'')+'</div>';
  if(!C.route) return s+'<p class="small">Starts after the starting quiz.</p></div>';
  s+='<div class="meter-row"><div class="meter" role="img" aria-label="Mastery '+pct(C.m)+'"><i style="width:'+pct(C.m)+'"></i></div><span class="meter-l">'+pct(C.m)+' · '+band(C.m)+'</span></div>'
  +'<dl class="kv small"><dt>Practice</dt><dd>'+prac.length+' answered, '+first+' right first time, '+(C.hints||0)+' hints</dd>'
  +'<dt>Checkpoint</dt><dd>'+(C.cp&&C.cp.passed?'<span class="ok">Passed</span>':(C.cp&&C.cp.tries?C.cp.tries+' '+(C.cp.tries===1?'try':'tries')+', not passed yet':'Not tried'))+'</dd></dl>';
  if(C.flag) s+='<p class="note"><strong>Check in:</strong> this learner did not pass the checkpoint after two tries.</p>';
  if((C.mis||[]).length) s+='<div><p><strong>Still believes:</strong></p><ul class="list small">'+C.mis.map(function(c){ return '<li>“'+esc(MIS[c]?MIS[c].think:c)+'”</li>'; }).join('')+'</ul></div>';
  if((C.resolved||[]).length) s+='<p class="small"><strong>Fixed ideas:</strong> '+C.resolved.length+'</p>';
  return s+'</div>';
 }).join('')+'</section>';

 var ans=(S.diag&&S.diag.ans)||{};
 h+='<section class="card stack"><h2>Starting quiz</h2><p class="small">'+(z.n?z.ok+' of '+z.n+' right':'Not started')+'</p>';
 if(z.n) h+='<div class="tw"><table class="data"><thead><tr><th>Question</th><th>Chose</th><th>Result</th></tr></thead><tbody>'
  +DIAG.map(function(d){ var a=ans[d.id]; if(!a) return ''; return '<tr><td>'+esc(d.stem)+'</td><td class="num">'+LET[a.choice]+'</td><td>'+(a.correct?'<span class="ok">Right</span>':'<span class="no">Answer '+LET[d.key]+'</span>')+'</td></tr>'; }).join('')+'</tbody></table></div>';
 h+='</section>';

 var w=writing(S);
 h+='<section class="card stack"><h2>Written work</h2>'+(w||'<p class="small">Nothing written yet.</p>')+'</section>';
 return h;
}
function qa(q,a){ return a&&String(a).trim()?'<div class="task"><p class="small">'+esc(q)+'</p><p style="white-space:pre-wrap">'+esc(a)+'</p></div>':''; }
function writing(S){
 var h='';
 ORDER.forEach(function(k){
  var s='', R=LESSON[k]&&LESSON[k].routine, notes=(S.routines||{})['L-'+k]||[];
  if(R) R.prompts.forEach(function(p,i){ s+=qa(R.name+' · '+p, notes[i]); });
  (TASKS[k]||[]).forEach(function(t){ s+=qa(t.kind+' · '+t.prompt, (S.frq||{})[t.id]); });
  if(s) h+='<h3>'+esc(CL[k].name)+'</h3>'+s;
 });
 var rf=S.reflect||{}, pl=S.pledge||{}, fp=S.fp||{}, end='';
 end+=qa('I used to think…',rf.used)+qa('Now I think…',rf.now)+qa('Headline for this chapter',rf.headline)+qa('Climate pledge · change 1',pl.a)+qa('Climate pledge · change 2',pl.b);
 var fps=FOOTPRINT.map(function(g){ var o=g.opts.filter(function(x){ return x[1]===fp[g.k]; })[0]; return o?'<li><strong>'+esc(g.name)+':</strong> '+esc(o[0])+'</li>':''; }).join('');
 if(fps) end+='<div class="task"><p class="small">Carbon footprint check</p><ul class="list">'+fps+'</ul></div>';
 if(end) h+='<h3>Reflection and action</h3>'+end;
 return h;
}

/* ---------- CSV ---------- */
function csv(){
 var head=['Name','Class','Last active','Starting quiz right','Starting quiz answered'];
 ORDER.forEach(function(k){ head.push(CL[k].name+' status',CL[k].name+' mastery %',CL[k].name+' checkpoint',CL[k].name+' check in'); });
 head.push('Ideas still held');
 var rows=visible().map(function(L){ var z=quiz(L), r=[L.name,L.cls,L.updated,z.ok,z.n];
  ORDER.forEach(function(k){ var C=cl(L,k); r.push(STATUS[C.status||'new'], C.route?Math.round(C.m*100):'', C.cp&&C.cp.passed?'Passed':(C.cp&&C.cp.tries?C.cp.tries+' tries':''), C.flag?'Yes':''); });
  r.push(held(L).map(function(c){ return MIS[c]?MIS[c].think:c; }).join(' | '));
  return r;
 });
 var text=[head].concat(rows).map(function(r){ return r.map(function(v){ v=String(v==null?'':v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }).join(','); }).join('\r\n');
 var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+text],{type:'text/csv'})); a.download='sky-to-soil-progress-'+new Date().toISOString().slice(0,10)+'.csv';
 document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
}

/* ---------- render & actions ---------- */
var lastKey='';
function render(){
 var L=T.open&&T.list&&T.list.filter(function(x){ return x.id===T.open; })[0];
 if(T.open && !L) T.open=null;
 app.innerHTML = !T.list ? vLogin() : L ? vLearner(L) : vClass();
 var key=(T.list?'list':'login')+'|'+(T.open||'');
 if(key!==lastKey){ if(lastKey){ window.scrollTo(0,0); var f=app.querySelector('[data-focus]'); if(f) f.focus({preventScroll:true}); } lastKey=key; }
}
var A = {
 refresh:function(){ load(); return false; },
 csv:function(){ csv(); return false; },
 signout:function(){ T.pw=''; writePw(''); T.list=null; T.open=null; T.err=''; },
 open:function(t){ T.open=t.dataset.id; },
 back:function(){ T.open=null; },
 'delete':function(t){
  var id=t.dataset.id, L=T.list.filter(function(x){ return x.id===id; })[0];
  if(!confirm('Remove '+(L&&L.name||'this learner')+' and all their answers? This cannot be undone. If they open the app again, they will appear again.')) return false;
  fetch('api/learners?id='+encodeURIComponent(id),{method:'DELETE',headers:{'x-teacher-password':T.pw}})
  .then(function(r){ if(!r.ok) throw 0; T.list=T.list.filter(function(x){ return x.id!==id; }); T.open=null; render(); })
  .catch(function(){ alert('Could not remove this learner. Please try again.'); });
  return false;
 },
 size:function(t){ T.scale=Math.min(1.4,Math.max(0.9,Math.round((T.scale+0.1*(+t.dataset.d))*10)/10)); document.documentElement.style.setProperty('--scale',T.scale); return false; }
};
document.addEventListener('click', function(e){ var t=e.target.closest('[data-act]'); if(!t||t.disabled) return; var f=A[t.dataset.act]; if(!f) return; if(f(t)!==false) render(); });
app.addEventListener('submit', function(e){ if(e.target.dataset.form!=='login') return; e.preventDefault(); var v=document.getElementById('pw').value; if(!v) return; T.pw=v; writePw(v); load(); });
app.addEventListener('input', function(e){ var t=e.target, f=t.dataset.f; if(!f) return; T[f]=t.value;
 var id=t.id, pos=t.selectionStart; render(); var n=document.getElementById(id); if(n){ n.focus(); if(pos!=null&&n.setSelectionRange) try{ n.setSelectionRange(pos,pos); }catch(x){} } });

if(T.pw) load(); else render();
})();

</script>
